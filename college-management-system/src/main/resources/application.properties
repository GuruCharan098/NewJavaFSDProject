# =================================
# APPLICATION CONFIGURATION
# =================================

spring.application.name=college-management-system

server.port=8080

# =================================
# MYSQL DATABASE CONFIGURATION
# =================================

spring.datasource.url=jdbc:mysql://localhost:3306/college_management_db?useSSL=false&serverTimezone=Asia/Kolkata

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:root123}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =================================
# JPA / HIBERNATE CONFIGURATION
# =================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# =================================
# JSON CONFIGURATION
# =================================

spring.jackson.serialization.indent-output=true

# Initial Admin Configuration
app.bootstrap-admin.email=gurucharan121@college.com
app.bootstrap-admin.password=guru@123
app.bootstrap-admin.name=System Administrator

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

